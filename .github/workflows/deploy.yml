name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to S3 and CloudFront
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Sts GetCallerIdentity
        run: aws sts get-caller-identity

      # Hashed build assets never change, so cache them for a year. No --delete:
      # a browser holding an older page can still fetch the chunks it needs.
      - name: Upload hashed assets
        run: |
          aws s3 sync dist/assets s3://${{ secrets.S3_BUCKET_NAME }}/assets \
            --cache-control "public,max-age=31536000,immutable"

      # Everything else (pages, sw.js, manifest, icons) must be revalidated on
      # every load so that new content and a new service worker are picked up.
      # Paths excluded from sync (assets/) are not touched by --delete.
      - name: Upload pages, service worker and manifest
        run: |
          aws s3 sync dist s3://${{ secrets.S3_BUCKET_NAME }} \
            --exclude "assets/*" \
            --delete \
            --cache-control "no-cache"
          aws s3 cp dist/manifest.webmanifest s3://${{ secrets.S3_BUCKET_NAME }}/manifest.webmanifest \
            --content-type "application/manifest+json" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*"
