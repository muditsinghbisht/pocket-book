      - id: cache-miss-01
        level: beginner
        type: mcq
        q: On a cache miss in cache-aside, what reads the database?
        options: [The cache, The application]
        answer: 1
        explain: In cache-aside the application owns loading data on a miss.
        hints:
          - The pattern is also called lazy loading.
          - The cache itself is passive here.

