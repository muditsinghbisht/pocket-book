questions:
  - id: time-map-01
    level: intermediate
    type: coding
    q: >-
      Time Based Key-Value Store (LeetCode 981). Keep every version of a key
      with its timestamp. `set(key, value, timestamp)` records a version, and
      `get(key, timestamp)` returns the value with the largest timestamp that
      is not after `timestamp`, or "" if there is none. Timestamps passed to
      `set` are strictly increasing. This is the shape of a versioned cache:
      point-in-time reads, and never letting an older version win.
    explain: >-
      Store a history per key. Because set timestamps only grow, appending
      keeps each history sorted, so get is a binary search for the last entry
      with time <= timestamp: set O(1), get O(log m) for m versions of the
      key. A per-key ordered map (TreeMap.floorEntry, std::map::upper_bound)
      costs O(log m) for both operations, but it also works if timestamps
      arrive out of order.
    hints:
      - Each key needs a history, not a single value.
      - Set timestamps only grow, so each key's history is already sorted.
      - You want the last entry whose timestamp is <= the query. Binary search for it.
    link: https://leetcode.com/problems/time-based-key-value-store/
    solutions:
      - title: Append-only history per key plus binary search
        java: |
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          class TimeMap {
              private record Version(int time, String value) {}

              private final Map<String, List<Version>> history = new HashMap<>();

              public TimeMap() {}

              public void set(String key, String value, int timestamp) {
                  history.computeIfAbsent(key, k -> new ArrayList<>()).add(new Version(timestamp, value));
              }

              public String get(String key, int timestamp) {
                  List<Version> versions = history.get(key);
                  if (versions == null) return "";
                  int lo = 0, hi = versions.size() - 1, found = -1;
                  while (lo <= hi) {
                      int mid = (lo + hi) >>> 1;
                      if (versions.get(mid).time() <= timestamp) {
                          found = mid;
                          lo = mid + 1;
                      } else {
                          hi = mid - 1;
                      }
                  }
                  return found < 0 ? "" : versions.get(found).value();
              }
          }
        cpp: |
          #include <algorithm>
          #include <iterator>
          #include <string>
          #include <unordered_map>
          #include <utility>
          #include <vector>

          class TimeMap {
              std::unordered_map<std::string, std::vector<std::pair<int, std::string>>> history;

          public:
              void set(const std::string& key, const std::string& value, int timestamp) {
                  history[key].emplace_back(timestamp, value);
              }

              std::string get(const std::string& key, int timestamp) {
                  auto it = history.find(key);
                  if (it == history.end()) return "";
                  const auto& versions = it->second;
                  // First version strictly after `timestamp`; the one before it is the answer.
                  auto after = std::upper_bound(
                      versions.begin(), versions.end(), timestamp,
                      [](int t, const std::pair<int, std::string>& v) { return t < v.first; });
                  return after == versions.begin() ? "" : std::prev(after)->second;
              }
          };
      - title: Ordered map per key (floor lookup)
        java: |
          import java.util.HashMap;
          import java.util.Map;
          import java.util.TreeMap;

          class TimeMap {
              private final Map<String, TreeMap<Integer, String>> history = new HashMap<>();

              public TimeMap() {}

              public void set(String key, String value, int timestamp) {
                  history.computeIfAbsent(key, k -> new TreeMap<>()).put(timestamp, value);
              }

              public String get(String key, int timestamp) {
                  TreeMap<Integer, String> versions = history.get(key);
                  if (versions == null) return "";
                  Map.Entry<Integer, String> e = versions.floorEntry(timestamp);
                  return e == null ? "" : e.getValue();
              }
          }
        cpp: |
          #include <iterator>
          #include <map>
          #include <string>
          #include <unordered_map>

          class TimeMap {
              std::unordered_map<std::string, std::map<int, std::string>> history;

          public:
              void set(const std::string& key, const std::string& value, int timestamp) {
                  history[key][timestamp] = value;
              }

              std::string get(const std::string& key, int timestamp) {
                  auto it = history.find(key);
                  if (it == history.end()) return "";
                  auto after = it->second.upper_bound(timestamp);
                  return after == it->second.begin() ? "" : std::prev(after)->second;
              }
          };

  - id: invalidate-delete-vs-set-01
    level: intermediate
    type: mcq
    q: >-
      In cache-aside, after writing to the database, many systems delete the
      cache key rather than writing the new value into the cache. Why?
    options:
      - Deleting is the only operation Memcached supports
      - Two concurrent writers can update the cache in a different order than they updated the database, leaving the older value cached; a delete lets the next read load the current value
      - Writing the value into the cache would always be slower than a database read
      - Deleting the key makes the next read a hit
    answer: 1
    explain: >-
      With "update the cache on write", writer A can commit to the database
      first but set the cache last, so the cache keeps A's older value
      indefinitely. Deleting is idempotent and order-insensitive: whatever the
      order, the next miss reads the database. A smaller race remains (a slow
      reader filling an old value after the delete), which is what leases or
      versioned sets close.
    hints:
      - Picture two writers and draw the order of their database and cache operations.
      - Which operation gives the same result regardless of order?

  - id: invalidate-lease-01
    level: staff
    type: mcq
    q: >-
      A cache uses leases in the style of Facebook's Memcache paper: on a miss
      the client gets a lease token and only a set that carries a valid token
      is accepted. Reader R misses and gets a token, then reads the old row
      from the database. Before R sets the value, a writer updates the row
      and deletes the key. What happens to R's set?
    options:
      - It is accepted, because R had the token first
      - It is rejected, because the delete invalidated R's token
      - It is accepted, but with a shorter TTL
      - It blocks until the writer's transaction is visible
    answer: 1
    explain: >-
      The delete invalidates outstanding lease tokens for the key, so the
      stale fill is refused and the next reader loads the new value. Leases
      also rate-limit fills for a key, which is how they double as stampede
      protection.
    hints:
      - The point of the token is to detect that something happened between the miss and the set.
      - What does the writer's delete do to tokens that were already handed out?

  - id: cache-consistency-proof-01
    level: staff
    type: free
    q: >-
      How would you show that a distributed cache is consistent with its
      database, and what would you do when it is not?
    answer: >-
      State the invariant: every cached value eventually equals the database
      value. Measure it instead of assuming it: sample keys, record what the
      cache returned, re-check against the database after a delay that allows
      in-flight invalidations to land, and report an inconsistency rate as a
      metric with an objective (this is the idea behind Meta's Polaris). Trace
      invalidation events end to end so you can find which step lost or
      reordered one. Prevent the common races with versions or timestamps
      (an older fill must never overwrite a newer value) and leases for
      fill-versus-invalidate ordering. Repair with targeted invalidation, and
      keep TTLs as a backstop that bounds how long any miss can last.
    explain: >-
      A strong answer separates detection (an invariant, sampling, tracing),
      prevention (versioning, leases, ordering) and repair (invalidate, TTL
      backstop), and treats consistency as something measured continuously.
    hints:
      - What exact invariant are you trying to check?
      - How do you tell "not yet invalidated" from "never will be"?
      - Which race lets an old value overwrite a new one, and how do versions stop it?

  - id: invalidation-backstop-01
    level: beginner
    type: mcq
    q: >-
      Your service deletes the cache entry on every write. Why should every
      entry still have a TTL?
    options:
      - The TTL makes deletes faster
      - The TTL raises the hit ratio above what deletes allow
      - The TTL bounds how long an entry stays wrong when a delete is lost or raced
      - Caches refuse to store entries that have no TTL
    answer: 2
    explain: >-
      Deletes can be lost (a crash, a dropped message) or defeated by a race
      (a slow reader refilling an old value). The TTL is the backstop that
      turns a possibly permanent error into a bounded one. It does not speed
      up deletes and, if anything, costs some hit ratio.

  - id: invalidation-order-01
    level: beginner
    type: mcq
    q: >-
      With cache-aside and delete-on-write, which order should the writer use?
    options:
      - Update the database, then delete the cache entry
      - Delete the cache entry, then update the database
      - Update both at the same time from two threads
      - Delete the entry twice and skip the database
    answer: 0
    explain: >-
      If you delete first, a reader can miss, read the old row and re-cache it
      before the write lands, which leaves a stale value with certainty.
      Writing the database first leaves only the narrow slow-reader race.

  - id: invalidation-hitratio-01
    level: intermediate
    type: numeric
    q: >-
      A key is requested as a Poisson process at 0.02 requests per second.
      Using h = lambda T / (1 + lambda T), what TTL in seconds gives a per-key
      hit ratio of 80 percent?
    answer: 200
    tolerance: 0
    unit: seconds
    explain: >-
      h = 0.8 means lambda T / (1 + lambda T) = 0.8, so lambda T = 4. Then
      T = 4 / 0.02 = 200 seconds. Tail keys need long TTLs to be useful at
      all.
    hints:
      - Solve h = x / (1 + x) for x = lambda T first.
      - For h = 0.8, x is 4.

  - id: invalidation-jitter-01
    level: intermediate
    type: numeric
    q: >-
      900,000 keys are loaded in the same second with a 600 s TTL. You add
      jitter so TTLs are spread uniformly over 480 to 600 s. At what rate, in
      keys per second, do the keys now expire?
    answer: 7500
    tolerance: 0
    unit: keys per second
    explain: >-
      The expiries spread over a window of 600 - 480 = 120 s, so the rate is
      900,000 / 120 = 7,500 keys per second. Without jitter all 900,000 expire
      in the same instant.
    hints:
      - How wide is the window over which expiries are spread?
      - Divide the number of keys by the width of that window.

  - id: invalidation-replicafill-01
    level: intermediate
    type: mcq
    q: >-
      Writes go to a primary and cache fills read a replica that lags by about
      2 seconds. The writer deletes the cache key right after each commit, yet
      users sometimes see old data until the TTL fires. What is the best fix?
    options:
      - Lengthen the TTL so that fewer fills happen
      - Fill from the primary, or make the fill versioned so an older version is rejected
      - Delete the key a second time immediately after the first delete
      - Move the cache to the same machine as the replica
    answer: 1
    explain: >-
      A reader that misses right after the delete reads the lagging replica
      and caches the old row (race B). Filling from the primary, or carrying
      a version so the cache refuses older data, removes the cause. An
      immediate second delete does not help because the stale fill happens
      after it, and a longer TTL only prolongs the damage.

  - id: invalidation-tombstone-01
    level: advanced
    type: mcq
    q: >-
      A cache accepts versioned sets only if the new version is higher than the
      stored one. A writer deletes key x (version 8) and a slow reader then
      tries to fill x with version 7. Why can the stale fill still succeed, and
      what prevents it?
    options:
      - Deletes are slower than sets, so keep the delete asynchronous
      - Versions can only go up in the database, so the cache cannot be wrong
      - Sets are atomic, so the race cannot occur at all
      - The key is absent after a delete, so there is no version to compare with; leave a short-lived tombstone carrying version 8
    answer: 3
    explain: >-
      After a plain delete the cache holds nothing to compare with, so any
      fill is accepted. A tombstone stores the deletion's version for a while
      so an older fill is rejected. It must outlive the longest read-miss
      latency plus replica lag, otherwise the race reopens.

  - id: invalidation-pubsub-01
    level: advanced
    type: mcq
    q: >-
      App servers keep in-process caches and learn about changes over
      fire-and-forget pub/sub. One server loses its connection for 30 seconds
      and reconnects. What should it do on reconnect?
    options:
      - Nothing, because it will receive the missed messages
      - Assume it missed messages and flush or revalidate its local cache, with a short TTL as backstop
      - Raise its local TTL so that it needs fewer messages
      - Subscribe a second time to the same channel
    answer: 1
    explain: >-
      Fire-and-forget pub/sub has no replay, so messages published while the
      subscriber was disconnected are gone. A stale local entry would live
      until its TTL. Flushing or revalidating on reconnect, plus a short TTL,
      bounds the damage.

  - id: invalidation-ryw-01
    level: staff
    type: mcq
    q: >-
      Users edit their profile, are redirected to it, and sometimes see the
      old data because the next request hits a different app server whose
      cache entry has not been invalidated yet. Pipeline p99 lag is 4 s. Which
      design fixes read-your-writes across servers most generally?
    options:
      - Sticky sessions only, because failover never happens
      - A cache TTL of 1 second for all data
      - Return the write's version in a cookie; treat cached entries older than it as misses and fill from a source at least that fresh
      - Send every read to the primary database
    answer: 2
    explain: >-
      A version token works across servers and replicas and costs extra source
      reads only for users who just wrote. Sticky sessions break at failover
      or rebalancing, a global 1-second TTL hurts the hit ratio for everyone
      and still leaves a window, and reading everything from the primary
      defeats the cache.

  - id: invalidation-design-01
    level: staff
    type: free
    q: >-
      Design cache handling for user permissions, where a revocation must take
      effect within a few seconds, but the permission check runs on every
      request. State the staleness budget, the mechanisms and the failure
      handling.
    answer: >-
      Budget: a revocation is visible within about 5 seconds in 99.9 percent
      of cases and never later than the TTL. Mechanisms: event-driven
      invalidation from the commit log (CDC or an outbox) so every writer is
      covered, deleting or version-setting the permission keys, plus a very
      short TTL (for example 30 to 60 s) as a backstop with jitter. Close the
      fill race with versioned fills or leases and fill from the primary,
      not a lagging replica. Add a heartbeat and lag alerts for the pipeline,
      and a periodic reconciliation or sampling probe. Sensitive actions
      (changing a password, moving money) bypass the cache and read the
      source of truth.
    explain: >-
      A strong answer states a numeric budget, layers a prompt mechanism with
      race closure and a TTL backstop, monitors the pipeline, and
      identifies the paths where no staleness is acceptable.
    hints:
      - What number would the security team accept for revocation delay?
      - What bounds the damage if an event is lost?
      - Which operations should never trust the cache?
