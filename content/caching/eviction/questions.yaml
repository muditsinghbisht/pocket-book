questions:
  - id: lru-cache-01
    level: intermediate
    type: coding
    q: >-
      LRU Cache (LeetCode 146). Build a fixed-capacity key/value store. `get`
      returns the value (or -1) and counts as a use; `put` inserts or updates,
      and when the cache is over capacity it evicts the entry that was used
      longest ago. Both operations must run in O(1) average time.
    explain: >-
      Combine a hash map (key to node) with a doubly linked list ordered by
      recency. Every access moves the node to the front; eviction removes the
      node at the back. Both approaches are O(1) per operation and
      O(capacity) space. The library version uses LinkedHashMap in access
      order (Java) or std::list::splice, which moves a node without
      invalidating iterators (C++).
    hints:
      - A hash map gives O(1) lookup but knows nothing about order.
      - You need an order you can reshuffle in O(1). Which list can remove a known node in O(1)?
      - Map each key to its list node. On every access move that node to the front; evict from the back.
    link: https://leetcode.com/problems/lru-cache/
    solutions:
      - title: Hash map plus hand-written doubly linked list with sentinels
        java: |
          import java.util.HashMap;
          import java.util.Map;

          class LRUCache {
              private static class Node {
                  int key, value;
                  Node prev, next;
                  Node(int key, int value) { this.key = key; this.value = value; }
              }

              private final int capacity;
              private final Map<Integer, Node> map = new HashMap<>();
              private final Node head = new Node(0, 0), tail = new Node(0, 0); // sentinels

              public LRUCache(int capacity) {
                  this.capacity = capacity;
                  head.next = tail;
                  tail.prev = head;
              }

              private void unlink(Node n) {
                  n.prev.next = n.next;
                  n.next.prev = n.prev;
              }

              private void pushFront(Node n) {
                  n.next = head.next;
                  n.prev = head;
                  head.next.prev = n;
                  head.next = n;
              }

              public int get(int key) {
                  Node n = map.get(key);
                  if (n == null) return -1;
                  unlink(n);
                  pushFront(n);
                  return n.value;
              }

              public void put(int key, int value) {
                  Node n = map.get(key);
                  if (n != null) {
                      n.value = value;
                      unlink(n);
                      pushFront(n);
                      return;
                  }
                  if (map.size() == capacity) {
                      Node lru = tail.prev;
                      unlink(lru);
                      map.remove(lru.key);
                  }
                  n = new Node(key, value);
                  map.put(key, n);
                  pushFront(n);
              }
          }
        cpp: |
          #include <unordered_map>

          class LRUCache {
              struct Node {
                  int key, value;
                  Node *prev = nullptr, *next = nullptr;
                  Node(int k, int v) : key(k), value(v) {}
              };

              int capacity;
              std::unordered_map<int, Node*> map;
              Node *head, *tail; // sentinels

              void unlink(Node* n) {
                  n->prev->next = n->next;
                  n->next->prev = n->prev;
              }

              void pushFront(Node* n) {
                  n->next = head->next;
                  n->prev = head;
                  head->next->prev = n;
                  head->next = n;
              }

          public:
              explicit LRUCache(int capacity)
                  : capacity(capacity), head(new Node(0, 0)), tail(new Node(0, 0)) {
                  head->next = tail;
                  tail->prev = head;
              }

              LRUCache(const LRUCache&) = delete;
              LRUCache& operator=(const LRUCache&) = delete;

              ~LRUCache() {
                  for (Node* n = head; n;) {
                      Node* next = n->next;
                      delete n;
                      n = next;
                  }
              }

              int get(int key) {
                  auto it = map.find(key);
                  if (it == map.end()) return -1;
                  unlink(it->second);
                  pushFront(it->second);
                  return it->second->value;
              }

              void put(int key, int value) {
                  auto it = map.find(key);
                  if (it != map.end()) {
                      it->second->value = value;
                      unlink(it->second);
                      pushFront(it->second);
                      return;
                  }
                  if ((int)map.size() == capacity) {
                      Node* lru = tail->prev;
                      unlink(lru);
                      map.erase(lru->key);
                      delete lru;
                  }
                  Node* n = new Node(key, value);
                  map[key] = n;
                  pushFront(n);
              }
          };
      - title: Library ordered structure (LinkedHashMap in access order, std::list with splice)
        java: |
          import java.util.LinkedHashMap;
          import java.util.Map;

          class LRUCache extends LinkedHashMap<Integer, Integer> {
              private final int capacity;

              public LRUCache(int capacity) {
                  super(capacity, 0.75f, true); // true = access order
                  this.capacity = capacity;
              }

              public int get(int key) {
                  return super.getOrDefault(key, -1); // counts as an access
              }

              public void put(int key, int value) {
                  super.put(key, value); // updating an existing key also moves it
              }

              @Override
              protected boolean removeEldestEntry(Map.Entry<Integer, Integer> eldest) {
                  return size() > capacity;
              }
          }
        cpp: |
          #include <list>
          #include <unordered_map>
          #include <utility>

          class LRUCache {
              int capacity;
              std::list<std::pair<int, int>> items; // front = most recent
              std::unordered_map<int, std::list<std::pair<int, int>>::iterator> index;

          public:
              explicit LRUCache(int capacity) : capacity(capacity) {}

              int get(int key) {
                  auto it = index.find(key);
                  if (it == index.end()) return -1;
                  items.splice(items.begin(), items, it->second); // iterator stays valid
                  return it->second->second;
              }

              void put(int key, int value) {
                  auto it = index.find(key);
                  if (it != index.end()) {
                      it->second->second = value;
                      items.splice(items.begin(), items, it->second);
                      return;
                  }
                  if ((int)items.size() == capacity) {
                      index.erase(items.back().first);
                      items.pop_back();
                  }
                  items.emplace_front(key, value);
                  index[key] = items.begin();
              }
          };

  - id: lfu-cache-01
    level: advanced
    type: coding
    q: >-
      LFU Cache (LeetCode 460). Like LRU, but eviction removes the entry used
      the fewest times; ties go to the least recently used among them. A new
      key starts with a use count of 1 and every `get` or `put` on a key bumps
      its count. `get` and `put` must run in O(1) average time, and the
      capacity may be 0.
    explain: >-
      The O(1) approach groups keys into buckets by use count. Each bucket
      keeps its keys in recency order, so the eviction victim is the oldest key
      in the bucket with the smallest count. Track that smallest count
      (minFreq): it becomes 1 after inserting a new key, and after a bump it
      only moves up when the old bucket was the minimum and is now empty. The
      ordered-set alternative sorts entries by (count, last-use tick). It is
      shorter and easier to get right, but it is O(log n) per operation, so it
      trades the stated O(1) bound for simplicity.
    hints:
      - Group keys by their use count.
      - Inside one count group you need recency order, and you must evict from the smallest non-empty count.
      - Track minFreq. After a new insert it is 1; after a bump it changes only if the old group became empty and was the minimum.
    link: https://leetcode.com/problems/lfu-cache/
    solutions:
      - title: Frequency buckets of recency-ordered keys, O(1)
        java: |
          import java.util.HashMap;
          import java.util.LinkedHashSet;
          import java.util.Map;

          class LFUCache {
              private final int capacity;
              private int minFreq = 0;
              private final Map<Integer, int[]> entries = new HashMap<>(); // key -> {value, freq}
              private final Map<Integer, LinkedHashSet<Integer>> buckets = new HashMap<>(); // freq -> keys, oldest first

              public LFUCache(int capacity) { this.capacity = capacity; }

              private void touch(int key) {
                  int[] e = entries.get(key);
                  int f = e[1];
                  LinkedHashSet<Integer> bucket = buckets.get(f);
                  bucket.remove(key);
                  if (bucket.isEmpty()) {
                      buckets.remove(f);
                      if (minFreq == f) minFreq++;
                  }
                  e[1] = f + 1;
                  buckets.computeIfAbsent(f + 1, x -> new LinkedHashSet<>()).add(key);
              }

              public int get(int key) {
                  int[] e = entries.get(key);
                  if (e == null) return -1;
                  touch(key);
                  return e[0];
              }

              public void put(int key, int value) {
                  if (capacity == 0) return;
                  int[] e = entries.get(key);
                  if (e != null) {
                      e[0] = value;
                      touch(key);
                      return;
                  }
                  if (entries.size() == capacity) {
                      LinkedHashSet<Integer> bucket = buckets.get(minFreq);
                      int victim = bucket.iterator().next(); // least recently used in the bucket
                      bucket.remove(victim);
                      if (bucket.isEmpty()) buckets.remove(minFreq);
                      entries.remove(victim);
                  }
                  entries.put(key, new int[] {value, 1});
                  buckets.computeIfAbsent(1, x -> new LinkedHashSet<>()).add(key);
                  minFreq = 1;
              }
          }
        cpp: |
          #include <iterator>
          #include <list>
          #include <unordered_map>
          #include <utility>

          class LFUCache {
              int capacity, minFreq = 0;
              std::unordered_map<int, std::pair<int, int>> entries;           // key -> {value, freq}
              std::unordered_map<int, std::list<int>> buckets;                // freq -> keys, front = oldest
              std::unordered_map<int, std::list<int>::iterator> pos;          // key -> place in its bucket

              void touch(int key) {
                  int f = entries[key].second;
                  auto& bucket = buckets[f];
                  bucket.erase(pos[key]);
                  if (bucket.empty()) {
                      buckets.erase(f);
                      if (minFreq == f) minFreq++;
                  }
                  entries[key].second = f + 1;
                  auto& next = buckets[f + 1];
                  next.push_back(key);
                  pos[key] = std::prev(next.end());
              }

          public:
              explicit LFUCache(int capacity) : capacity(capacity) {}

              int get(int key) {
                  if (!entries.count(key)) return -1;
                  touch(key);
                  return entries[key].first;
              }

              void put(int key, int value) {
                  if (capacity == 0) return;
                  if (entries.count(key)) {
                      entries[key].first = value;
                      touch(key);
                      return;
                  }
                  if ((int)entries.size() == capacity) {
                      auto& bucket = buckets[minFreq];
                      int victim = bucket.front();
                      bucket.pop_front();
                      if (bucket.empty()) buckets.erase(minFreq);
                      entries.erase(victim);
                      pos.erase(victim);
                  }
                  entries[key] = {value, 1};
                  auto& ones = buckets[1];
                  ones.push_back(key);
                  pos[key] = std::prev(ones.end());
                  minFreq = 1;
              }
          };
      - title: Ordered set by (count, last use), O(log n)
        java: |
          import java.util.HashMap;
          import java.util.Map;
          import java.util.TreeSet;

          class LFUCache {
              private static class Node {
                  int key, value, freq = 1;
                  long tick;
                  Node(int key, int value, long tick) { this.key = key; this.value = value; this.tick = tick; }
              }

              private final int capacity;
              private long tick = 0;
              private final Map<Integer, Node> map = new HashMap<>();
              private final TreeSet<Node> order = new TreeSet<>(
                  (a, b) -> a.freq != b.freq ? Integer.compare(a.freq, b.freq) : Long.compare(a.tick, b.tick));

              public LFUCache(int capacity) { this.capacity = capacity; }

              private void bump(Node n) {
                  order.remove(n); // remove before changing the sort key
                  n.freq++;
                  n.tick = ++tick;
                  order.add(n);
              }

              public int get(int key) {
                  Node n = map.get(key);
                  if (n == null) return -1;
                  bump(n);
                  return n.value;
              }

              public void put(int key, int value) {
                  if (capacity == 0) return;
                  Node n = map.get(key);
                  if (n != null) {
                      n.value = value;
                      bump(n);
                      return;
                  }
                  if (map.size() == capacity) map.remove(order.pollFirst().key);
                  n = new Node(key, value, ++tick);
                  map.put(key, n);
                  order.add(n);
              }
          }
        cpp: |
          #include <set>
          #include <tuple>
          #include <unordered_map>

          class LFUCache {
              struct Info { int value, freq; long long tick; };
              int capacity;
              long long tick = 0;
              std::unordered_map<int, Info> map;
              std::set<std::tuple<int, long long, int>> order; // (freq, tick, key), smallest = victim

              void bump(int key) {
                  Info& i = map[key];
                  order.erase({i.freq, i.tick, key});
                  i.freq++;
                  i.tick = ++tick;
                  order.insert({i.freq, i.tick, key});
              }

          public:
              explicit LFUCache(int capacity) : capacity(capacity) {}

              int get(int key) {
                  auto it = map.find(key);
                  if (it == map.end()) return -1;
                  bump(key);
                  return it->second.value;
              }

              void put(int key, int value) {
                  if (capacity == 0) return;
                  auto it = map.find(key);
                  if (it != map.end()) {
                      it->second.value = value;
                      bump(key);
                      return;
                  }
                  if ((int)map.size() == capacity) {
                      map.erase(std::get<2>(*order.begin()));
                      order.erase(order.begin());
                  }
                  map[key] = {value, 1, ++tick};
                  order.insert({1, tick, key});
              }
          };

  - id: all-oone-01
    level: staff
    type: coding
    q: >-
      All O`one Data Structure (LeetCode 432). Keep counts for string keys with
      `inc` (add 1, inserting the key at 1), `dec` (subtract 1, deleting the key
      at 0; the key is guaranteed to exist), `getMaxKey` and `getMinKey` (any
      key with the largest or smallest count, or "" if there are none). Every
      operation must run in O(1) average time.
    explain: >-
      This is the same frequency-bucket trick that makes LFU O(1). Keep a
      doubly linked list of count buckets in ascending order and a map from
      key to its bucket. Counts change by exactly 1, so a key only moves to a
      neighbouring bucket, which you create or delete on demand; the min and
      max are the first and last buckets. The ordered-map alternative (count
      to keys) is simpler, but each inc or dec is O(log d) where d is the
      number of distinct counts, so it trades the O(1) bound for simplicity.
    hints:
      - A hash map of counts handles inc and dec, but not min and max.
      - Group keys by count and keep the groups sorted by count.
      - Counts change by exactly 1, so a key only moves to the neighbouring group. Use a doubly linked list of groups and create or delete groups as needed.
    link: https://leetcode.com/problems/all-oone-data-structure/
    solutions:
      - title: Doubly linked list of count buckets, O(1)
        java: |
          import java.util.HashMap;
          import java.util.LinkedHashSet;
          import java.util.Map;
          import java.util.Set;

          class AllOne {
              private static class Bucket {
                  final int count;
                  final Set<String> keys = new LinkedHashSet<>();
                  Bucket prev, next;
                  Bucket(int count) { this.count = count; }
              }

              private final Bucket head = new Bucket(0), tail = new Bucket(0); // sentinels, ascending counts
              private final Map<String, Bucket> where = new HashMap<>();

              public AllOne() {
                  head.next = tail;
                  tail.prev = head;
              }

              private Bucket insertAfter(Bucket p, int count) {
                  Bucket b = new Bucket(count);
                  b.prev = p;
                  b.next = p.next;
                  p.next.prev = b;
                  p.next = b;
                  return b;
              }

              private void removeKey(Bucket b, String key) {
                  b.keys.remove(key);
                  if (b.keys.isEmpty()) {
                      b.prev.next = b.next;
                      b.next.prev = b.prev;
                  }
              }

              public void inc(String key) {
                  Bucket b = where.get(key);
                  Bucket anchor = b == null ? head : b;
                  int want = anchor.count + 1;
                  Bucket target = anchor.next;
                  if (target == tail || target.count != want) target = insertAfter(anchor, want);
                  target.keys.add(key);
                  where.put(key, target);
                  if (b != null) removeKey(b, key);
              }

              public void dec(String key) {
                  Bucket b = where.get(key);
                  if (b.count == 1) {
                      where.remove(key);
                  } else {
                      Bucket target = b.prev;
                      if (target == head || target.count != b.count - 1) target = insertAfter(b.prev, b.count - 1);
                      target.keys.add(key);
                      where.put(key, target);
                  }
                  removeKey(b, key);
              }

              public String getMaxKey() {
                  return tail.prev == head ? "" : tail.prev.keys.iterator().next();
              }

              public String getMinKey() {
                  return head.next == tail ? "" : head.next.keys.iterator().next();
              }
          }
        cpp: |
          #include <iterator>
          #include <list>
          #include <string>
          #include <unordered_map>
          #include <unordered_set>

          class AllOne {
              struct Bucket {
                  int count;
                  std::unordered_set<std::string> keys;
              };
              std::list<Bucket> buckets; // ascending by count, never holds an empty bucket
              std::unordered_map<std::string, std::list<Bucket>::iterator> where;

          public:
              void inc(const std::string& key) {
                  auto f = where.find(key);
                  if (f == where.end()) {
                      if (buckets.empty() || buckets.front().count != 1) buckets.push_front({1, {}});
                      buckets.front().keys.insert(key);
                      where[key] = buckets.begin();
                      return;
                  }
                  auto cur = f->second;
                  auto next = std::next(cur);
                  if (next == buckets.end() || next->count != cur->count + 1)
                      next = buckets.insert(next, {cur->count + 1, {}});
                  next->keys.insert(key);
                  where[key] = next;
                  cur->keys.erase(key);
                  if (cur->keys.empty()) buckets.erase(cur);
              }

              void dec(const std::string& key) {
                  auto cur = where[key];
                  if (cur->count == 1) {
                      where.erase(key);
                  } else {
                      if (cur == buckets.begin() || std::prev(cur)->count != cur->count - 1)
                          buckets.insert(cur, {cur->count - 1, {}});
                      auto prev = std::prev(cur);
                      prev->keys.insert(key);
                      where[key] = prev;
                  }
                  cur->keys.erase(key);
                  if (cur->keys.empty()) buckets.erase(cur);
              }

              std::string getMaxKey() { return buckets.empty() ? "" : *buckets.back().keys.begin(); }
              std::string getMinKey() { return buckets.empty() ? "" : *buckets.front().keys.begin(); }
          };
      - title: Ordered map from count to keys, O(log d)
        java: |
          import java.util.HashMap;
          import java.util.LinkedHashSet;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeMap;

          class AllOne {
              private final Map<String, Integer> count = new HashMap<>();
              private final TreeMap<Integer, Set<String>> byCount = new TreeMap<>();

              private void removeFrom(int c, String key) {
                  Set<String> s = byCount.get(c);
                  s.remove(key);
                  if (s.isEmpty()) byCount.remove(c);
              }

              private void addTo(int c, String key) {
                  byCount.computeIfAbsent(c, x -> new LinkedHashSet<>()).add(key);
              }

              public void inc(String key) {
                  int c = count.getOrDefault(key, 0);
                  if (c > 0) removeFrom(c, key);
                  count.put(key, c + 1);
                  addTo(c + 1, key);
              }

              public void dec(String key) {
                  int c = count.get(key);
                  removeFrom(c, key);
                  if (c == 1) {
                      count.remove(key);
                  } else {
                      count.put(key, c - 1);
                      addTo(c - 1, key);
                  }
              }

              public String getMaxKey() {
                  return byCount.isEmpty() ? "" : byCount.lastEntry().getValue().iterator().next();
              }

              public String getMinKey() {
                  return byCount.isEmpty() ? "" : byCount.firstEntry().getValue().iterator().next();
              }
          }
        cpp: |
          #include <map>
          #include <string>
          #include <unordered_map>
          #include <unordered_set>

          class AllOne {
              std::unordered_map<std::string, int> count;
              std::map<int, std::unordered_set<std::string>> byCount;

              void removeFrom(int c, const std::string& key) {
                  auto it = byCount.find(c);
                  it->second.erase(key);
                  if (it->second.empty()) byCount.erase(it);
              }

          public:
              void inc(const std::string& key) {
                  int c = count[key]; // 0 for a new key
                  if (c > 0) removeFrom(c, key);
                  count[key] = c + 1;
                  byCount[c + 1].insert(key);
              }

              void dec(const std::string& key) {
                  int c = count[key];
                  removeFrom(c, key);
                  if (c == 1) {
                      count.erase(key);
                  } else {
                      count[key] = c - 1;
                      byCount[c - 1].insert(key);
                  }
              }

              std::string getMaxKey() { return byCount.empty() ? "" : *byCount.rbegin()->second.begin(); }
              std::string getMinKey() { return byCount.empty() ? "" : *byCount.begin()->second.begin(); }
          };

  - id: lru-trace-01
    level: beginner
    type: numeric
    q: >-
      An LRU cache with capacity 3 starts empty. It sees the access sequence
      A B C A D B C A. How many of the 8 accesses are hits?
    answer: 1
    tolerance: 0
    unit: hits
    explain: >-
      Trace (least recent first): A miss [A], B miss [A B], C miss [A B C],
      A hit [B C A], D miss evicts B [C A D], B miss evicts C [A D B], C miss
      evicts A [D B C], A miss evicts D [B C A]. One hit in eight: a cyclic
      pattern slightly larger than the cache is LRU's worst case.
    hints:
      - Write the cache contents after every access, least recent first.
      - On a miss with a full cache, the leftmost entry is evicted.

  - id: eviction-lru-vs-scan-01
    level: intermediate
    type: mcq
    q: >-
      A nightly report scans every row of a large table once, through the same
      LRU cache that serves the hot working set. What usually happens?
    options:
      - Nothing; LRU ignores keys that are read only once
      - The scan pushes the hot keys out, and the hit ratio drops until they are reloaded
      - The cache grows to fit the scan
      - LRU switches to LFU behaviour automatically
    answer: 1
    explain: >-
      Plain LRU treats every newly read key as most recent, so a one-pass scan
      evicts the hot set (cache pollution). Scan-resistant policies, such as
      segmented LRU, 2Q, ARC or admission filters, keep a key out of the
      protected region until it has been seen more than once.
    hints:
      - Where does LRU put a key the first time it is read?
      - How many times is each scanned row read?

  - id: eviction-lru-trace-02
    level: beginner
    type: numeric
    q: >-
      An LRU cache with capacity 3 starts empty and sees the sequence
      A B C A B D A B. How many of the 8 requests are hits?
    answer: 4
    tolerance: 0
    unit: hits
    explain: >-
      Trace, least recent first: A miss [A], B miss [A B], C miss [A B C],
      A hit [B C A], B hit [C A B], D miss and evict C [A B D], A hit
      [B D A], B hit [D A B]. Four hits. A and B are reused before C's slot
      is needed, which is exactly the temporal locality LRU bets on.
    hints:
      - Write the cache after every request, least recent first.
      - A hit moves the item to the most recent end; a miss on a full cache evicts the leftmost item.

  - id: eviction-belady-min-01
    level: beginner
    type: mcq
    q: >-
      On a miss with a full cache, which item does Belady's optimal (MIN)
      policy evict?
    options:
      - The item that was used least recently
      - The item with the lowest access count
      - The item whose next use is farthest in the future, or that is never used again
      - A uniformly random item
    answer: 2
    explain: >-
      MIN needs the future: it evicts the item that will be needed last, which
      postpones the next miss as long as possible. That is why it is a
      benchmark and not an implementable online policy. Least recent is LRU,
      lowest count is LFU, and random is the random policy.

  - id: eviction-hit-cost-01
    level: beginner
    type: mcq
    q: >-
      Which of these policies does no bookkeeping at all when a request is a
      cache hit?
    options:
      - LRU, which moves the node to the front of the list
      - CLOCK, which sets a reference bit
      - LFU, which increments a counter
      - FIFO, which only tracks insertion order
    answer: 3
    explain: >-
      FIFO orders items by when they were inserted, and a hit does not change
      that, so a hit costs nothing. LRU relinks a node, LFU updates a counter
      and CLOCK stores one bit. That cheap hit path is why FIFO-style designs
      are attractive at very high request rates.

  - id: eviction-byte-hit-ratio-01
    level: beginner
    type: mcq
    q: >-
      A CDN pays mainly for traffic from its origin servers. Which metric should
      its eviction policy try to maximize?
    options:
      - Object hit ratio, because it counts every request equally
      - Byte hit ratio, because it measures how much origin traffic is avoided
      - The number of distinct objects held in the cache
      - Nothing; the metric does not affect the choice of policy
    answer: 1
    explain: >-
      Origin bandwidth is paid per byte, so the goal is to avoid fetching bytes.
      Byte hit ratio favours keeping large popular objects, while object hit
      ratio favours many small ones. In the lesson's example a single 100 MB
      object serves 1,000 MB per hour from cache against 50 MB for 100 small
      objects, even though the small objects produce five times more hits.

  - id: eviction-lfu-trace-01
    level: intermediate
    type: numeric
    q: >-
      An LFU cache with capacity 2 breaks frequency ties by evicting the least
      recently used item, and an item's count starts at 1 each time it is
      loaded. How many hits does the sequence A A B C B A produce?
    answer: 2
    tolerance: 0
    unit: hits
    explain: >-
      A miss {A:1}, A hit {A:2}, B miss {A:2, B:1}, C miss evicts B (lowest
      count) {A:2, C:1}, B miss evicts C (count 1 against A's 2) {A:2, B:1},
      A hit. Hits are the second and the last request: 2. The newest slot keeps
      churning while A holds its count, which is LFU's cold-start behaviour.
    hints:
      - Track the counts as well as the contents.
      - When a new item arrives, evict the one with the lowest count, never A while it has count 2.

  - id: eviction-reuse-distance-01
    level: intermediate
    type: numeric
    q: >-
      A 50-request trace has this reuse-distance histogram. Fewer than 2 distinct
      items in between: 10 requests. 2 or 3: 15. 4 to 7: 5. 8 or more but finite:
      5. Infinite (first access): 15. What is the LRU hit ratio, in percent, for
      a cache of 4 entries?
    answer: 50
    tolerance: 0
    unit: percent
    explain: >-
      Under LRU a request hits in a cache of size k exactly when its reuse
      distance is less than k. For k = 4 that is the buckets with distance 0 to
      3: 10 + 15 = 25 hits out of 50, which is 50 percent. The 15 infinite
      distances are compulsory misses and cap the best possible ratio at 70
      percent.
    hints:
      - A request hits when its reuse distance is less than the cache size.
      - Add the buckets whose distances are all below 4.

  - id: eviction-countmin-estimate-01
    level: intermediate
    type: numeric
    q: >-
      A count-min sketch has 2 rows and 4 columns. Key X hashes to columns
      (0, 1), key Y to (0, 2) and key Z to (3, 1). After the stream X X Y Z Z Z,
      what does the sketch estimate for X?
    answer: 3
    tolerance: 0
    explain: >-
      Row 1: column 0 holds X twice plus Y once, so 3; column 3 holds Z three
      times. Row 2: column 1 holds X twice plus Z three times, so 5; column 2
      holds Y once. The estimate for X is min(3, 5) = 3, an overestimate of its
      true count 2 because Y collided with it in row 1. The estimate can never
      be below the true count.
    hints:
      - Update every row for every request, then take the minimum over the key's cells.
      - Add up all keys that land in the same column of the same row.

  - id: eviction-arc-ghost-01
    level: intermediate
    type: mcq
    q: >-
      An ARC cache gets a miss for a key that is found in ghost list B2. What
      does ARC conclude and do?
    options:
      - T1 was too small, so it increases p
      - The item is a one-hit wonder, so it is inserted at the front of T1
      - T2 was too small, so it decreases p and loads the item into T2
      - The ghost entry is stale, so it is ignored and the miss is treated as brand new
    answer: 2
    explain: >-
      B2 holds keys recently evicted from T2, the frequency list. A hit there
      means ARC regrets an eviction from T2, so it shrinks p (the target size
      of T1) to give T2 more room and loads the item into T2. A B1 hit does the
      opposite.

  - id: eviction-sampled-lru-01
    level: intermediate
    type: numeric
    q: >-
      Sampled LRU picks 3 random entries and evicts the oldest of the sample.
      What is the probability, in percent, that the sample contains at least one
      entry from the older half of the cache? Assume uniform sampling.
    answer: 87.5
    tolerance: 0.1
    unit: percent
    explain: >-
      The sample misses the older half only if all 3 entries come from the
      younger half: (1/2)^3 = 12.5 percent. So the chance of at least one
      older-half entry is 87.5 percent, and the oldest of the sample is then
      in the older half. Each extra sample roughly halves the failure chance.
    hints:
      - Compute the chance that every sampled entry is in the younger half.
      - Subtract that chance from 1.

  - id: eviction-arc-p-update-01
    level: advanced
    type: numeric
    q: >-
      An ARC cache has c = 100 and p = 40, with |B1| = 10 and |B2| = 30 (assume
      the ghost list sizes do not change). A request hits in B1, and then a
      request hits in B2. What is p afterwards?
    answer: 42
    tolerance: 0
    explain: >-
      B1 hit with |B1| = 10 < |B2| = 30: p increases by |B2| / |B1| = 3, so
      p = 43. B2 hit with |B2| = 30 >= |B1| = 10: p decreases by 1, so p = 42.
      The step is larger when the ghost list that produced the hit is the
      smaller one, because each hit from a small list is the rarer signal.
    hints:
      - The increment on a B1 hit is 1 if |B1| >= |B2|, otherwise |B2| / |B1|.
      - The decrement on a B2 hit is 1 if |B2| >= |B1|, otherwise |B1| / |B2|.

  - id: eviction-gdsf-priority-01
    level: advanced
    type: numeric
    q: >-
      A GDSF cache has inflation value L = 2. An object of size 4 MB with a miss
      cost of 12 ms has been requested 3 times while cached. What is its
      priority H?
    answer: 11
    tolerance: 0
    explain: >-
      GDSF sets H = L + freq x cost / size = 2 + 3 x 12 / 4 = 2 + 9 = 11. The
      object is evicted only when it has the smallest H, and L then rises to
      that value, which is how stale objects age out.
    hints:
      - Use H = L + freq x cost / size.
      - Compute the benefit density cost / size first, then multiply by the frequency.

  - id: eviction-wtinylfu-window-01
    level: advanced
    type: mcq
    q: >-
      A product page suddenly goes viral. A cache that uses pure TinyLFU
      admission, with no window, keeps missing on it for several minutes even
      though the requests are frequent. What is the most likely cause and the
      standard remedy?
    options:
      - The sketch counters are saturated, so halve the sample size
      - The doorkeeper has a false positive, so enlarge the Bloom filter
      - The eviction order is wrong, so switch the main region from SLRU to FIFO
      - The new key's estimated frequency is lower than the victim's, so it is rejected before it can prove itself; add a small window that admits every new item
    answer: 3
    explain: >-
      A brand-new key starts with a low estimate while established victims
      have higher counts, so pure admission rejects it, and each rejected
      request is another miss. W-TinyLFU puts a small LRU window in front
      that admits everything for a while, letting a burst accumulate hits and
      sketch counts before it faces the admission contest.

  - id: eviction-competitive-lru-01
    level: advanced
    type: free
    q: >-
      LRU is k-competitive. Why is that not a good argument for choosing LRU
      over FIFO in production?
    answer: >-
      The k-competitive bound is a worst-case guarantee shared by LRU, FIFO
      and every marking algorithm, so it cannot tell them apart. It is only
      reached on contrived inputs, and k is huge in practice. Real behaviour
      depends on workload locality and is measured by trace replay.
    explain: >-
      Competitive analysis is a robustness certificate, not a performance
      predictor. LRU and FIFO have the same bound, yet differ on real traces
      (and FIFO also has Belady's anomaly). Choose between them with
      trace-driven simulation against OPT and LRU baselines.

  - id: eviction-opt-trace-01
    level: staff
    type: numeric
    q: >-
      A cache of k = 4 sees the cyclic trace A B C D E repeated four times (20
      requests: A B C D E A B C D E ...). LRU misses all 20. How many misses
      does Belady's MIN incur?
    answer: 8
    tolerance: 0
    unit: misses
    explain: >-
      Requests 1 to 4 miss. Request 5 (E) evicts D, the farthest next use, and
      A, B, C hit. Request 9 (D) evicts C and request 13 (C) evicts B. Request 17
      (B) evicts A, which is never used again, and the rest hit. Misses at
      requests 1, 2, 3, 4, 5, 9, 13 and 17 give 8. LRU's 20 over OPT's 8 is a
      ratio of 2.5, approaching k = 4 as the trace grows.
    hints:
      - On a miss, look ahead and evict the cached item whose next occurrence is farthest, or that never recurs.
      - After each miss MIN gets several hits in a row.

  - id: eviction-eviction-age-01
    level: staff
    type: mcq
    q: >-
      Your cache has a 1 hour TTL, but the dashboard shows evicted entries had
      been in the cache only 4 minutes on average and the hit ratio is falling
      as traffic grows. What is the best interpretation and first action?
    options:
      - Capacity is ample, because entries are being removed so quickly
      - The TTL is too long, so reduce it to 4 minutes
      - The policy is broken, so replace LRU with random eviction immediately
      - The cache is too small for the working set, so check the miss-ratio curve and size or admission before touching the TTL
    answer: 3
    explain: >-
      If entries are evicted far younger than their TTL, capacity (not expiry)
      is the limit: useful entries are pushed out early. Plot the miss-ratio
      curve on a recent trace to see where the knee is, and consider bigger
      capacity, a scan-resistant policy or an admission filter. Changing the
      TTL does not help because entries never live that long.

  - id: eviction-lru-concurrency-01
    level: staff
    type: mcq
    q: >-
      A 64-core service uses one global lock around an LRU list, and profiling
      shows the lock dominating CPU. Which change removes most of the hit-path
      contention with the smallest expected loss in hit ratio?
    options:
      - Replace the hash map with a tree so lookups are faster
      - Increase the cache capacity so there are fewer evictions
      - Shard the cache and record hits in buffers that are replayed in batches, or use a CLOCK-style bit
      - Switch to LFU, because it does not update anything on a hit
    answer: 2
    explain: >-
      The cost is that every hit mutates the shared list under one lock. Sharding
      splits the lock, batched replay of recorded accesses takes the list update
      off the hit path, and CLOCK reduces a hit to a bit store. All three
      approximate global LRU order with only a small hit-ratio loss. LFU still
      updates counters on every hit, and the other options do not touch the
      lock.

  - id: eviction-policy-choice-01
    level: staff
    type: free
    q: >-
      Your in-process cache serves a skewed key-value workload with many one-hit
      wonders, occasional viral bursts, a nightly full scan and objects from 200
      bytes to 2 MB. Outline a policy design and how you would validate it.
    answer: >-
      Use an admission-controlled, scan-resistant design such as W-TinyLFU: a
      small window for bursts, a segmented main region and a sketch with aging
      to reject one-hit wonders and scan items. Add a maximum object size or
      size-aware admission and weights in bytes. Validate with a recorded trace
      replayed against LRU and OPT at several sizes, plus shadow caches in
      production.
    explain: >-
      Each feature of the workload maps to a mechanism: one-hit wonders and
      scans to admission, bursts to the window, variable sizes to byte weights
      and size limits. State the objective first (object, byte or cost hit
      ratio), include the nightly job in the trace, compare the gap closed
      between LRU and OPT, and monitor hit ratio by key class and eviction age.
